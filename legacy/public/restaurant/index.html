<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant portal · Bite Wise</title>
<meta name="description" content="Bite Wise: rescue good restaurant food at a discount around greater Seattle.">
<meta name="theme-color" content="#07110d">
<link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="page">
  <div class="container">
    <div class="page-head">
      <div><h1 id="r-title">Restaurant portal</h1><p class="muted" style="margin:4px 0 0" id="r-sub"></p></div>
      <span class="spacer"></span>
      <a class="btn btn-ghost" href="/restaurant/report">📄 Daily report</a>
      <button class="btn btn-ghost sound-toggle" id="sound-btn" type="button">🔔 Order sound: on</button>
      <button class="btn btn-primary" id="new-offer-btn">+ Post surplus food</button>
    </div>
    <div id="r-status-banner" class="hidden"></div>
    <div id="sound-banner" class="alert-banner hidden">🔔 <span>Click anywhere on this page to turn on the new-order bell. Browsers block sound until you interact with the page.</span></div>
    <div class="kpis" id="kpis"></div>
    <div class="tabs" role="tablist">
      <button data-tab="pickup" class="on">Verify pickup</button>
      <button data-tab="offers">My offers</button>
      <button data-tab="menu">Menu</button>
      <button data-tab="orders">Orders</button>
      <button data-tab="payouts">Payouts</button>
      <button data-tab="profile">Profile &amp; tax</button>
    </div>
    <section data-panel="pickup"></section>
    <section data-panel="offers" class="hidden"></section>
    <section data-panel="menu" class="hidden"></section>
    <section data-panel="orders" class="hidden"></section>
    <section data-panel="payouts" class="hidden"></section>
    <section data-panel="profile" class="hidden"></section>
  </div>
</main>
<script src="/vendor/leaflet/leaflet.js"></script>
<script type="module" src="/js/restaurant.js"></script>
</body>
</html>
