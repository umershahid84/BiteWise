<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Bite Wise</title>
<meta name="description" content="Bite Wise: rescue good restaurant food at a discount around greater Seattle.">
<meta name="theme-color" content="#07110d">
<link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="auth-wrap">
  <div class="card auth-card">
    <img class="logo" src="/assets/logo-mark.svg" alt="">
    <h1 class="center" style="font-size:1.7rem">Welcome back</h1>
    <p class="center muted">Log in to rescue some food.</p>
    <div id="msg"></div>
    <form id="login-form" novalidate>
      <div class="field"><label for="login">Email or user name</label><input id="login" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="center small muted" style="margin-top:16px">New to Bite Wise? <a href="/signup">Create a free account</a></p>
    <div class="legal-links" style="margin-top:10px"><a href="/legal/customer-terms" target="_blank">Customer Terms</a><a href="/legal/restaurant-agreement" target="_blank">Partner Agreement</a><a href="/legal/privacy" target="_blank">Privacy</a></div>
  </div>
</main>
<script type="module" src="/js/auth-pages.js"></script>
</body>
</html>
