<!--
  The illustrated "real life" part of the customer tour: order on the phone, drive to the restaurant, show the PIN and
  pick up. record.mjs injects this into the page and shows one scene at a time (adding "active" starts its
  animations), each timed to a line of the narration. Drawn at 1280×720, the recording size.
-->
<style>
  #bw-story { position: fixed; inset: 0; z-index: 2147482000; background: #0b1f17; animation: s-fade .6s ease both; font-family: var(--font-jakarta), var(--font-inter), system-ui, sans-serif; }
  #bw-cursor { display: none !important; }
  #bw-story .scene { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; }
  #bw-story .scene.active { opacity: 1; }
  #bw-story svg { display: block; width: 100%; height: 100%; }
  #bw-story .scene:not(.active) * { animation-play-state: paused !important; }
  #bw-story [class] { transform-box: fill-box; }
  #bw-story .step { position: absolute; left: 48px; top: 40px; display: flex; align-items: center; gap: 14px; padding: 10px 22px 10px 10px;
    border-radius: 999px; background: rgba(20, 40, 75, .92); color: #fff; font-weight: 800; font-size: 26px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    animation: s-pop .7s cubic-bezier(.34,1.56,.64,1) .2s both; }
  #bw-story .step b { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: #6cc24a; color: #0b1f17; font-size: 24px; }

  @keyframes s-pop { from { transform: scale(.4); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes s-fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes s-up { from { transform: translateY(60px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes s-float { 0% { transform: translateY(0); opacity: 0 } 20% { opacity: 1 } 100% { transform: translateY(-120px); opacity: 0 } }
  @keyframes s-tap { 0% { transform: scale(.2); opacity: .9 } 100% { transform: scale(2.2); opacity: 0 } }
  @keyframes s-swap-out { to { opacity: 0 } }
  @keyframes s-blink { 0%, 92%, 100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }

  /* Scene 1: ordering on the phone */
  .s1 .phone { animation: s-up .8s cubic-bezier(.2,.8,.2,1) .3s both; }
  .s1 .tap { transform-origin: center; animation: s-tap .6s ease-out 1.95s both; }
  .s1 .btn-order { animation: s-swap-out .2s linear 2.05s both; }
  .s1 .btn-done { animation: s-fade .2s linear 2.05s both; }
  .s1 .pin-panel { animation: s-up .7s cubic-bezier(.34,1.56,.64,1) 2.7s both; }
  .s1 .heart { animation: s-float 2.4s ease-out both; }
  .s1 .eyes { transform-origin: center; animation: s-blink 3.4s linear infinite; }

  /* Scene 2: driving to the restaurant (everything slows down as the car arrives) */
  .s2 .far { animation: s2-far 7s cubic-bezier(.25,.6,.35,1) .2s both; }
  .s2 .near { animation: s2-near 7s cubic-bezier(.25,.6,.35,1) .2s both; }
  .s2 .lanes { animation: s2-lanes 7s cubic-bezier(.25,.6,.35,1) .2s both; }
  .s2 .shop { animation: s2-shop 7s cubic-bezier(.25,.6,.35,1) .2s both; }
  .s2 .wheel { transform-origin: center; animation: s2-wheel 7s cubic-bezier(.25,.6,.35,1) .2s both; }
  .s2 .cloud { animation: s2-cloud 30s linear both; }
  .s2 .pin { transform-origin: 50% 100%; animation: s-pop .7s cubic-bezier(.34,1.56,.64,1) 6.8s both; }
  @keyframes s2-far { from { transform: translateX(0) } to { transform: translateX(-420px) } }
  @keyframes s2-near { from { transform: translateX(0) } to { transform: translateX(-1300px) } }
  @keyframes s2-lanes { from { transform: translateX(0) } to { transform: translateX(-1600px) } }
  @keyframes s2-shop { from { transform: translateX(1300px) } to { transform: translateX(0) } }
  @keyframes s2-wheel { from { transform: rotate(0) } to { transform: rotate(-2200deg) } }
  @keyframes s2-cloud { from { transform: translateX(0) } to { transform: translateX(-300px) } }

  /* Scene 3: the pickup at the counter */
  .s3 .cust-phone { transform-origin: 0% 100%; animation: s-pop .6s cubic-bezier(.34,1.56,.64,1) .4s both; }
  .s3 .pos-pop { transform-origin: 50% 100%; animation: s-pop .6s cubic-bezier(.34,1.56,.64,1) 1.1s both; }
  .s3 .digit { animation: s-pop .3s cubic-bezier(.34,1.56,.64,1) both; }
  .s3 .check { transform-origin: center; animation: s-pop .5s cubic-bezier(.34,1.56,.64,1) 3.6s both; }
  .s3 .bag { animation: s3-bag 1.4s cubic-bezier(.3,.7,.3,1) 4.3s both; }
  .s3 .banner { transform-origin: center; animation: s-pop .7s cubic-bezier(.34,1.56,.64,1) 6s both; }
  .s3 .heart { animation: s-float 2.4s ease-out both; }
  .s3 .eyes { transform-origin: center; animation: s-blink 3.1s linear infinite; }
  @keyframes s3-bag { from { transform: translateX(300px) } to { transform: translateX(0) } }
</style>
